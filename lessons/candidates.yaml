- id: write-script-001
  step: write
  rule: Giữ tổng lời đọc `say` dưới khoảng 230 âm tiết để giọng không vượt 57 giây;
    đếm âm tiết trước khi nộp kịch bản, vượt thì cắt ý phụ.
  why: Bước voice bị trả lại vì giọng dài 60.3s > 57s, phải cắt khoảng 17 âm tiết;
    lỗi gốc nằm ở độ dài kịch bản.
  from_owner: false
  status: candidate
  first_seen: '2026-11-07'
  last_seen: '2026-11-07'
  evidence: 1
