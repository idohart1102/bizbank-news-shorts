# Cấu hình máy: xem docs/INSTALL.md. Bỏ hẳn khóa để dùng mặc định; không ghi null/rỗng.
data_dir: episodes                 # nơi lưu dữ liệu các tập (không vào Git); NEWS_DATA_DIR ghi đè
tts:
  backend: platform_tts            # CLI căn từ; provider vieneu không cần dịch vụ HTTP/Vbee key
  bin: bin/tts                    # CLI đóng gói trong repo; không cài gói PyPI tên tts
  platform_tts_url: http://127.0.0.1:8791 # cổng được truyền sang CLI bằng TTS_PORT
agents:
  claude:
    backend: claude_cli            # đã hỗ trợ; anthropic_api chưa triển khai
    bin: claude
    model: claude-opus-5-5
  sonnet:                         # gom tin, kiểm fact, tìm ảnh thật
    backend: claude_cli
    bin: claude
    model: claude-sonnet-5-5
  codex:
    backend: codex_cli
    image_backend: codex_cli        # image_gen tích hợp, dùng đăng nhập Codex; không cần 9router/API key ảnh
    image_timeout: 1800             # giây; model/provider lấy từ cấu hình Codex CLI của máy
    bin: codex
bins: {ffmpeg: ffmpeg, ffprobe: ffprobe, node: node, npx: npx, npm: npm}
notify: {macos: true}
