# Nguồn tin theo danh sách ưu tiên của Sếp ("BizBank Academy - List nguồn lấy tin", cập nhật 2026-11-12).
# tier (luật nguồn, core/news/checks.py): 1 = chính thống, đủ 1 nguồn; 2 = báo, cần 2 nguồn độc lập;
#   3 = chỉ tham khảo/tín hiệu (aggregator, mạng xã hội), không tính là nguồn độc lập.
# group (mức ưu tiên + vai trò, xem `groups`): 1–4 theo tài liệu của Sếp; 0 = nguồn bổ sung ngoài danh sách.
# Danh sách là ưu tiên, không phải giới hạn: nguồn ngoài danh sách phải được Sếp duyệt (config/sources_approved.yaml,
#   `bin/news sources pending|approve|reject`); nguồn lạ làm tập dừng needs_human ở bước pick/write.
# rss: feed đọc tự động (core/news/feeds.py). Nguồn không có rss (hoặc rss hỏng) chỉ dùng khi đối chiếu fact.
groups:
  1: Chính thống, cơ quan nhà nước. Ưu tiên cao nhất cho chính sách, thuế, tín dụng; lấy văn bản gốc ở đây thay vì đọc lại qua báo.
  2: Báo kinh tế lớn, chuyên sâu SME. Nguồn số liệu tốt (VnBusiness, VnEconomy cho khoảng trống tín dụng SME).
  3: Báo đại chúng. Chỉ để bắt mạch dư luận và lấy ngôn ngữ khách hàng; KHÔNG dùng làm nguồn số liệu/quote.
  4: Chuyên biệt hộ kinh doanh, siêu nhỏ. Gần tệp khách hàng nhất; cơ quan thuế là nguồn gốc cho mọi thay đổi thuế hộ kinh doanh.
  0: Bổ sung ngoài danh sách Sếp. Dùng như nhóm 3, riêng Thư viện Pháp luật dùng để tra nguyên văn văn bản.
