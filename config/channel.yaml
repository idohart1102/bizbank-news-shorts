slug: news-vn
lang: vi
audience: hộ kinh doanh, SME Việt Nam
video:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 59
  template: assets/template/overlay.png
  layout: assets/template/layout.json
tts:
  service: bundled_tts         # bin/tts, source core/tts; URL ở machine.yaml
  provider: vbee
  voice: hn_female_ngochuyen_full_48k-fhg   # HN - Ngọc Huyền (Sếp chọn 2026-11-07)
  speed: 1.0
  pauses: {sentence: 0.1, major: 0.1, medium: 0.1, paragraph: 0}   # Sếp: đọc liền mạch, ngắt nghỉ ngắn nhất Vbee cho phép
  project: news-video
  export_srt: true             # Vbee không có SRT; platform/tts căn bằng Whisper tại máy, không tốn credit
sfx:
  library: assets/sfx/         # Pixabay, license trong assets/sfx/LICENSES.csv
  transition: whoosh
  volume_db: -14
music:
  enabled: true                # Sếp 2026-11-07: nhạc nền nhỏ xuyên suốt video
  library: assets/music/       # Pixabay, license trong assets/music/LICENSES.csv
  lufs: -32                    # giọng -14 LUFS: nhạc nhỏ hơn ~18 dB
  fade_in_s: 0.8
  fade_out_s: 1.5
drive_folder: TODO
schedule:                      # chỉ khai báo; sinh/cài lịch theo docs/INSTALL.md
  - "10:30"
  - "19:00"
episodes_per_run: 1
budget:
  vbee_chars_per_day: 0        # 0 = không giới hạn (Sếp 2026-11-08: bỏ hạn mức Vbee). Đặt số > 0 nếu muốn chặn lại
publish:
  mode: outbox                 # outbox = xếp hàng chờ đấu nối API; sau: youtube/tiktok/facebook adapter
  platforms: [youtube_shorts, tiktok, facebook_reels]
notify:
  channel: telegram            # chưa đấu nối; tạm ghi episodes/notifications.jsonl + macOS notification
  telegram: {enabled: false}
