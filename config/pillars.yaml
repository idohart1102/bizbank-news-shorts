      - {name: Quỹ Phát triển doanh nghiệp nhỏ và vừa, url: https://smedf.gov.vn, tier: 1, access: auto, use: điều kiện, hồ sơ vay ưu đãi cho SME}
      - {name: Cục Thuế, url: https://gdt.gov.vn, tier: 1, access: auto, use: hướng dẫn kê khai, nộp thuế, hóa đơn cho hộ kinh doanh}
