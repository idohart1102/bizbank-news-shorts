# 4 chủ đề của kênh (Sếp chốt 2026-11-18), dùng chung cho hướng tin tức (1.1) và kiến thức (1.2).
# id: mã máy dùng trong inbox.json / brief.json (phải khớp enum `pillar` trong core/schemas/{inbox,brief}.schema.json).
# weight: tỷ trọng mong muốn trong các tập gần đây (tạm đặt, Sếp đổi được). pick-stories ưu tiên chủ đề đang thiếu,
#   nhưng không chọn tin kém (score < 6) chỉ để đủ tỷ trọng.
# keywords: từ khóa lọc thô RSS (khớp không dấu, nguyên từ), cộng thêm vào `keywords` chung trong sources.yaml;
#   cũng dùng để gợi ý chủ đề (pillar_hints) cho Claude Sonnet ở bước gom tin. Không dùng từ đơn «ai» (trùng «ai» = người nào).
#   Nguồn tiếng Anh khai `keywords` riêng trong sources.yaml (thay cho bộ chung).
#   Thuế, hóa đơn tạm xếp vào «von» (tài chính doanh nghiệp); mức phạt, thủ tục pháp lý vào «luat».
# references: nguồn tham chiếu nền cho hướng kiến thức (1.2), Sếp giao AI chọn 2026-11-19, không phụ thuộc đối tác.
#   access: auto = máy đọc được; manual = chặn máy đọc/cần đăng nhập, mở bằng tay khi kiểm fact.
#   Nguồn nước ngoài (HBR, HubSpot) chỉ lấy khung kiến thức, không lấy số liệu làm số liệu Việt Nam.
kinds:              # tỷ trọng 2 hướng nội dung (Sếp 2026-11-18); nhánh kiến thức xây ở giai đoạn 2
  news: 4
  knowledge: 1
recent_window: 10   # số tập gần nhất dùng để tính tỷ trọng chủ đề
pillars:
  - id: von
    name: Vốn (tài chính doanh nghiệp)
    partner: BizBank
    weight: 40
    keywords: [vay von, goi vay, khoan vay, lai suat, tin dung, ngan hang, von luu dong, bao lanh, the chap, tin chap, quy phat trien doanh nghiep, ho tro von, no xau, dao no, gia han no, thue, hoa don, khai thue, quyet toan, thue khoan, ma so thue]
