# 4 chủ đề của kênh (Sếp chốt 2026-11-18), dùng chung cho hướng tin tức (1.1) và kiến thức (1.2).
# id: mã máy dùng trong inbox.json / brief.json (phải khớp enum `pillar` trong core/schemas/{inbox,brief}.schema.json).
# weight: tỷ trọng mong muốn trong các tập gần đây (tạm đặt, Sếp đổi được). pick-stories ưu tiên chủ đề đang thiếu,
#   nhưng không chọn tin kém (score < 6) chỉ để đủ tỷ trọng.
# keywords: từ khóa lọc thô RSS (khớp không dấu, nguyên từ), cộng thêm vào `keywords` chung trong sources.yaml;
#   cũng dùng để gợi ý chủ đề (pillar_hints) cho Claude Sonnet ở bước gom tin. Không dùng từ đơn «ai» (trùng «ai» = người nào).
#   Nguồn tiếng Anh khai `keywords` riêng trong sources.yaml (thay cho bộ chung).
#   Thuế, hóa đơn tạm xếp vào «von» (tài chính doanh nghiệp); mức phạt, thủ tục pháp lý vào «luat».
