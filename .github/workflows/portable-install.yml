name: Portable install
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: core/remotion/package-lock.json
      - name: Install FFmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
              libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
              libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          else
            brew install ffmpeg
          fi
      - name: Install from a clean checkout
        run: bin/bootstrap --with-tts --skip-tts-model
      - name: Import platform aligner (no model download or paid call)
        run: .venv-align/bin/python -c 'import platform; __import__("mlx_whisper" if platform.system() == "Darwin" and platform.machine() == "arm64" else "faster_whisper")'
      - name: Check local environment
        run: bin/news doctor --local
      - name: Test (includes a real Remotion render, no paid services)
        env:
          NEWS_OFFLINE: '1'
          NEWS_NOTIFY: '0'
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Validate generated schedule (does not enable jobs)
        shell: bash
        run: |
          .venv/bin/python core/scripts/schedule.py
          if [ "$RUNNER_OS" = Linux ]; then
            systemd-analyze verify local/ops/bizbank-news-video.service local/ops/bizbank-news-video.timer
          else
            plutil -lint local/ops/vn.bizbank.news-video.plist
          fi
      - name: Repository guard
        run: .venv/bin/python -I core/scripts/guard_repo.py pre-push
